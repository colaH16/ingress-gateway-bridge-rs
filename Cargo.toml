[package]
name = "ingress-gateway-bridge-rs"
version = "0.2.0"
default-run = "ingress-gateway-bridge-rs"
edition = "2024"
license = "Apache-2.0"
description = "Rust learning port of the Go Ingress to HTTPRoute translator, with a single-writer Kubernetes controller"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

anyhow = "1"
regex = "1"
serde_yaml = "0.9"
kube = { version = "4.2", features = ["runtime", "client", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["v1_35"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "time"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
